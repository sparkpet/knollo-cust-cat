<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knollo 고객 유형화 리포트</title>
<style>
:root{--ink:#141c2b;--mut:#5f6e86;--line:#e6ebf3;--brand:#1f9d57;--warn:#e07b39}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,'Segoe UI','Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;
 background:radial-gradient(45% 40% at 12% 8%,#d6f2e3 0%,rgba(214,242,227,0) 60%),radial-gradient(40% 45% at 92% 6%,#dbe8fb 0%,rgba(219,232,251,0) 60%),radial-gradient(50% 45% at 85% 92%,#f6e6da 0%,rgba(246,230,218,0) 55%),radial-gradient(45% 45% at 8% 95%,#e7e0f6 0%,rgba(231,224,246,0) 55%),#f7f9fc}
.wrap{max-width:1200px;margin:0 auto;padding:24px 18px}
.hd{display:flex;justify-content:space-between;align-items:flex-end}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--mut);margin-top:3px}
.meta{font-size:12px;color:var(--mut);text-align:right}.meta b{color:var(--brand)}
.banner{display:none;font-size:11.5px;background:#fff6ed;color:#7a5a1e;border-radius:9px;padding:7px 12px;margin:10px 0}
.menu{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.mi{padding:9px 15px;border-radius:11px;background:rgba(255,255,255,.6);border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:13px;color:#5b6b82;backdrop-filter:blur(6px)}
.mi.on{background:#fff;color:var(--brand);box-shadow:0 4px 14px rgba(31,157,87,.14)}
.page{display:none}.page.on{display:block}
.tile{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-top:12px;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(20,30,50,.05)}
.tile h2{font-size:14px;margin:0 0 2px}.tile .d{font-size:11px;color:var(--mut);margin-bottom:9px}
table{border-collapse:collapse;width:100%;font-size:11px}
th,td{border:1px solid #eef1f6;padding:5px 6px;text-align:center}th{background:#f4f7fa;color:#5b6b82;font-weight:600;font-size:10px}
td.rh{background:#f8fafc;font-weight:700;text-align:left;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.l{text-align:left}
.n{font-weight:800;font-size:13px}.bar4{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:4px 0 3px}.bar4>i{display:block}
.mini{font-size:8.6px;color:#6a7789}
.m1 td.cell{cursor:pointer}.m1 td.cell:hover{outline:2px solid var(--brand);outline-offset:-2px}
.cell2{text-align:right}.rev{font-weight:800;font-size:11.3px}.contrib{font-size:9px;color:#5b6b82}.tot{color:#4b3fc0;font-weight:800}
.prow{cursor:pointer}.prow:hover td.rh{background:#eef7f0}.prow.on td{outline:1px solid rgba(31,157,87,.45);outline-offset:-1px}.prow.on td.rh{box-shadow:inset 3px 0 0 var(--brand);background:#eaf7ef}
.scrolly{max-height:460px;overflow:auto}.scrolly th{position:sticky;top:0;z-index:2}
.btns{display:inline-flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.btn{font-size:11px;font-weight:700;border:1px solid #d7deea;background:#fff;color:#5b6b82;border-radius:8px;padding:4px 12px;cursor:pointer}.btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.xbrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.xb{white-space:nowrap;border-color:#bfe0cd;color:#1f7a45}.xb:hover{background:#eaf7ef}
.skurow{cursor:pointer}.skurow:hover{background:#f3f9f5}.skurow.on{background:#eaf7ef}
.drill{margin-top:10px;border:1px dashed #c7d0dd;border-radius:10px;padding:10px 12px;background:#fbfcfe;display:none}.drill.on{display:block}
.note{font-size:10.5px;color:#7a5a1e;background:#fff6ed;border-radius:6px;padding:5px 9px;margin-top:6px}
.wrapx{overflow-x:auto}.fail{color:#c0392b}.amt{font-size:9px;color:#5b6b82}.sub2{font-size:10.5px;font-weight:700;color:#41505f;margin:10px 0 3px}
.gl{font-size:11.5px;color:#33414f;line-height:1.55}.gl b{color:#1e2a3a}.gl .row{padding:6px 0;border-bottom:1px solid var(--line)}
.glsec .st{font-size:12px;font-weight:800;color:#1f2b3a;margin:14px 0 7px}
.glgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:720px){.glgrid{grid-template-columns:1fr}}
.glcard{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;border-left:4px solid var(--brand)}
.glcard .t{font-weight:800;font-size:12.5px;margin-bottom:3px;color:#1e2a3a}.glcard .x{font-size:11px;color:#41505f;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:10px;font-weight:700;border-radius:6px;padding:1px 8px;background:#eef1f5;color:#41505f}.chip.c{color:#fff}
.leg{font-size:10px;color:#5b6b82;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}.leg span{display:inline-flex;gap:4px;align-items:center}.leg i{width:10px;height:10px;border-radius:2px}
</style></head><body><div class="wrap">
<div class="hd"><div><h1>Knollo 고객 유형화 리포트</h1><div class="sub">라이프사이클 × 카테고리 × 브랜드충성 · CRM 기여·전환 · 시트→Apps Script→GitHub 자동빌드</div></div><div class="meta" id="meta"></div></div>
<div class="banner" id="banner"></div>
<div class="menu">
  <div class="mi on" onclick="go(0)">ⓘ 용어·정의</div>
  <div class="mi" onclick="go(1)">① 유형 지형도</div>
  <div class="mi" onclick="go(2)">② 카테고리 매출·CRM 기여</div>
  <div class="mi" onclick="go(3)">③ 발송 전환·기여 매출</div>
  <div class="mi" onclick="go(4)">④ 코호트 · 첫구매·재구매</div>
</div>
<div class="page on" id="p0"></div>
<div class="page" id="p1"></div>
<div class="page" id="p2"></div>
<div class="page" id="p3"></div>
<div class="page" id="p4"></div>
</div>
<script>
var LIFE=["최우수","우량","신규","이탈징후","관망","이탈"];
var CATS=["허니콤츄","덴탈라인업","영양제","위생/패드","산책용품","간식"];
var GC=["#1f6b3f","#7bc49b","#5aa0c9","#c8d0da"], GL=["코","성","관","비"], GN=["코어","성장","관계형성","비충성"];
var LC={"최우수":"#1f6b3f","우량":"#25965a","신규":"#5aa0c9","이탈징후":"#e07b39","관망":"#9b8cc4","이탈":"#8a97a8"};
var num=n=>n===''||n==null?0:Number(n);
var fmt=n=>Number(n||0).toLocaleString('ko-KR');
var won=n=>fmt(Math.round(Number(n||0)))+'원';   // 전체 단위 표기 (예: 1,870,123원)
var pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
/* ★ 인원 추출용 Apps Script 웹앱 URL (배포 후 여기에 입력). 비우면 안내 표시. */
var EXTRACT_URL="https://script.google.com/a/macros/sparkpetkorea.com/s/AKfycbyls84TH10dxtr5ZFv87Xh0JTnJetRCB8wZ-uUOLkKty0gsCPIFe3KeB4_sZHvz1xZF3Q/exec";
function go(i){document.querySelectorAll('.mi').forEach((m,k)=>m.classList.toggle('on',k===i));document.querySelectorAll('.page').forEach((p,k)=>p.classList.toggle('on',k===i));}
function heat(core,tot){var a=Math.min(1,tot?(core/tot)/0.55:0);var t=Math.round(255-(255-233)*a),g=Math.round(255-(255-246)*a),b=Math.round(255-(255-238)*a);return 'rgb('+t+','+g+','+b+')';}
function crmHeat(p){if(!p)return '#fff';var a=Math.min(1,p/0.5);return 'rgba(31,157,87,'+(0.06+a*0.22)+')';}

var D=null, PREVM=null;
function render(d){D=d;
 document.getElementById('meta').innerHTML=`기간 <b>${d.meta.latest_period||''}</b> · 전체 <b>${fmt(d.meta.n)}</b>명<br>빌드 ${d.meta.built_at||''} · 스냅 ${d.meta.periods||d.matrix.length}회`;
 if(d.meta.sample){var b=document.getElementById('banner');b.style.display='block';b.textContent='⚠ 샘플 데이터(실데이터 아님). 시트→Apps Script 빌드 시 report_data.json 으로 대체.';}
 glossary(); matrixTab(); contribTab('day'); convTab(); cohortTab();
}

/* ⓘ 용어집 */
function glossary(){
 function lum(hex){if(!hex||hex[0]!=='#'||hex.length<7)return 1;var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)/255;}
 function chip(t,c){if(!c)return `<span class="chip">${t}</span>`;var dark=lum(c)<0.62;return `<span class="chip" style="background:${c};color:${dark?'#fff':'#2c3a4a'}">${t}</span>`;}
 function chips(arr){return '<div class="chips">'+arr.map(function(a){return chip(a[0],a[1]);}).join('')+'</div>';}
 function card(t,x,extra){return `<div class="glcard" ${extra&&extra.color?`style="border-left-color:${extra.color}"`:''}><div class="t">${t}</div><div class="x">${x}</div>${extra&&extra.chips?chips(extra.chips):''}</div>`;}
 function deftbl(title,sub,colHead,rows){
   return `<div class="glcard"><div class="t">${title}</div><div class="x" style="margin-bottom:6px">${sub}</div>`+
     `<table><tr><th style="text-align:left">${colHead}</th><th style="text-align:left">정의</th></tr>`+
     rows.map(function(r){return `<tr><td style="text-align:left"><span class="chip" style="background:${r[1]};color:${lum(r[1])<0.62?'#fff':'#2c3a4a'}">${r[0]}</span></td><td style="text-align:left" class="x">${r[2]}</td></tr>`;}).join('')+
     `</table></div>`;
 }
 var lifeTbl=deftbl("라이프사이클 <span class='mini'>· 행축</span>","구매 <b>최근성 × 빈도</b>. 고객당 1개(배타).","단계",[
   ["최우수",LC["최우수"],"최근성 ≤60일 · 주문 5회+"],
   ["우량",LC["우량"],"≤60일 · 2~4회"],
   ["신규",LC["신규"],"≤60일 · 1회"],
   ["이탈징후",LC["이탈징후"],"61~150일 · 3회+"],
   ["관망",LC["관망"],"61~150일 · ≤2회"],
   ["이탈",LC["이탈"],">150일"]]);
 var loyTbl=deftbl("브랜드 충성 등급 <span class='mini'>· 셀 안</span>","라이프사이클과 <b>독립</b>. <b>빈도 × 카테폭</b>만 사용(최근성 미포함) → 모든 단계에서 4등급이 나타남.","등급",[
   ["코어",GC[0],"주문 5회+ · 카테 2개+ (깊고 넓은 반복)"],
   ["성장",GC[1],"주문 3회+ (반복 형성)"],
   ["관계형성",GC[2],"주문 2회 (첫 재구매)"],
   ["비충성",GC[3],"주문 1회 (단발)"]]);
 var sec1=lifeTbl+loyTbl
  + card("대표 카테고리 <span class='mini'>· 열축</span>","고객이 <b>가장 자주 산 카테고리</b>(주문수 1위).",{chips:CATS.map(function(c){return [c];})});

 var sec2=card("CRM 기여","매출 중 <b>CRM 발급 쿠폰</b>(crm_campaign_target)이 사용된 몫. 카테×기간 격자에서 ₩/비율.")
  + card("전환 <span class='mini'>· 발송→7일</span>","발송 후 7일 내 결제. <b>구간별(비누적)</b> 속도로 구분 · 7일계=합.",{chips:[["0~3일","#1f7a45"],["4~5일","#5aa0c9"],["6~7일","#8a97a8"]]})
  + card("매출 3분류","전환 매출을 쿠폰 사용 형태로 분리.",{chips:[["쿠폰=캠페인쿠폰","#1f7a45"],["기여=다른쿠폰","#3b7bbf"],["비쿠폰=무쿠폰","#8a97a8"]]});

 var sec3=card("SKU 기준","crm_sku_map(sku→rep_sku, <b>units</b>=구성갯수) → crm_product(option_name) → 카테고리. 라인금액은 units 비중으로 rep_sku 배분. 보조표²에서 rep_sku 내 sku_code(단품·번들) TOP5.")
  + card("인원 추출 <span class='mini'>· PII</span>","유형 지형도 셀 클릭 → <b>인원 추출</b> → Apps Script 웹앱이 customers_pii 탭 필터 → <b>새 구글시트 생성</b>(연락처 포함·마스킹 없음). PII는 구글 인증 안에만, 공개 리포트/GitHub 미저장.",{color:"#e07b39"});

 var h='<div class="tile"><h2>용어·정의</h2><div class="d">이 리포트가 쓰는 축·등급·지표 정의.</div>'+
   '<div class="glsec"><div class="st">▪ 분류 축 (누구를 어떻게 나누나)</div><div class="glgrid">'+sec1+'</div></div>'+
   '<div class="glsec"><div class="st">▪ 매출·전환 지표</div><div class="glgrid">'+sec2+'</div></div>'+
   '<div class="glsec"><div class="st">▪ 데이터·운영</div><div class="glgrid">'+sec3+'</div></div>'+
  '</div>';
 document.getElementById('p0').innerHTML=h;
}

/* ① 유형 지형도 */
function matrixTab(){
 var cur=D.matrix[D.matrix.length-1], prev=D.matrix.length>1?D.matrix[D.matrix.length-2]:null;
 function cellOf(m,L,C){var lc=m.cells.find(x=>x.life===L);return lc?lc.cats.find(x=>x.cat===C):null;}
 var h='<div class="tile"><h2>유형 지형도 — 라이프사이클 × 카테고리</h2><div class="d">셀 = 총원 + 4색 비율 바 + 등급 요약(코·성·관·비). 배경=코어 비중. 셀 클릭 → 등급 브레이크다운.</div>';
 h+='<table class="m1"><tr><th>라이프 \\ 카테</th>'+CATS.map(c=>`<th>${c}</th>`).join('')+'</tr>';
 LIFE.forEach(function(L){h+=`<tr><td class="rh">${L}</td>`;CATS.forEach(function(C){var x=cellOf(cur,L,C)||{core:0,grow:0,risk:0,non:0};var tot=x.core+x.grow+x.risk+x.non;var v=[x.core,x.grow,x.risk,x.non];
  var bar=v.map((n,i)=>`<i style="width:${tot?n/tot*100:0}%;background:${GC[i]}"></i>`).join('');
  h+=`<td class="cell" style="background:${heat(x.core,tot)}" onclick="drill('${L}','${C}')"><div class="n">${fmt(tot)}<span style="font-weight:600;font-size:9px;color:#6a7789"> 명</span></div><div class="bar4">${bar}</div><div class="mini">코${x.core} 성${x.grow} 관${x.risk} 비${x.non}</div></td>`;});h+='</tr>';});
 h+='</table><div class="leg">'+GN.map((g,i)=>`<span><i style="background:${GC[i]}"></i>${g}</span>`).join('')+'</div>';
 h+='<div class="drill" id="drill"></div></div>';
 document.getElementById('p1').innerHTML=h;
 PREVM=prev;
}
function drill(L,C){
 var cur=D.matrix[D.matrix.length-1];var prev=PREVM;
 function cellOf(m,L,C){var lc=m.cells.find(x=>x.life===L);return lc?lc.cats.find(x=>x.cat===C):null;}
 var x=cellOf(cur,L,C)||{core:0,grow:0,risk:0,non:0};var tot=x.core+x.grow+x.risk+x.non;
 var p=prev?cellOf(prev,L,C):null;
 function dl(cur,prev){if(prev==null)return'';var dd=cur-prev;if(!dd)return' <span style="color:#8a97a8">±0</span>';return ` <span style="color:${dd>0?'#1f8a5b':'#c0392b'}">${dd>0?'▲':'▼'}${fmt(Math.abs(dd))}</span>`;}
 function eb(g,cnt){return `<span class="btn xb" onclick="extract('${L}','${C}','${g}')">${g} 추출 · ${fmt(cnt)}명</span>`;}
 var h=`<b>${L} × ${C}</b> · 총 ${fmt(tot)}명<table style="margin-top:6px"><tr><th>등급</th><th class="num">인원</th><th class="num">비율</th><th class="num">직전대비</th></tr>`+
  GN.map(function(g,i){var key=['core','grow','risk','non'][i];return `<tr><td class="l"><b>${g}</b></td><td class="num">${fmt(x[key])}명</td><td class="num">${pct(x[key],tot)}%</td><td class="num">${p?dl(x[key],p[key]):'-'}</td></tr>`;}).join('')+'</table>'+
  `<div style="margin-top:9px;font-size:11px"><b>인원 추출</b> <span class="mini">(연락처 포함·마스킹 없음 · 새 구글시트 생성)</span>`+
  `<div class="xbrow">`+eb('전체',tot)+eb('코어',x.core)+eb('성장',x.grow)+eb('관계형성',x.risk)+eb('비충성',x.non)+`</div></div>`+
  `<div class="note">추출은 구글 인증 안(Apps Script 웹앱)에서만 동작하며 PII는 공개 리포트/GitHub에 저장되지 않습니다.</div>`;
 var el=document.getElementById('drill');el.innerHTML=h;el.classList.add('on');
}
function extract(L,C,grade){
 if(!EXTRACT_URL){alert('인원 추출 URL 미설정.\n\nApps Script 웹앱(doGet)을 배포한 뒤, report.html 상단 EXTRACT_URL 에 웹앱 URL을 넣으세요.\n그 전엔 시트의 [유형화 리포트] 메뉴 > [인원 추출]로도 가능합니다.');return;}
 var u=EXTRACT_URL+(EXTRACT_URL.indexOf('?')>=0?'&':'?')+'life='+encodeURIComponent(L)+'&cat='+encodeURIComponent(C)+'&grade='+encodeURIComponent(grade);
 window.open(u,'_blank');
}

/* ② 카테 매출·CRM 기여 (일/주/월) + 기간연동 보조표(행 클릭 → 그 기간 재집계) */
var CGRAIN='day', CSEL=null, CCAT=null, CURROWS=[];
function bkey(grain,d){d=String(d);
 if(grain==='month')return d.slice(0,7);
 if(grain!=='week')return d;
 var p=d.split('-'),dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));var dow=(dt.getUTCDay()+6)%7;dt.setUTCDate(dt.getUTCDate()-dow);return dt.toISOString().slice(0,10);
}
function contribRows(grain){var map={};
 D.cat_contrib.forEach(function(r){var k=bkey(grain,r.d);map[k]=map[k]||{};map[k][r.cat]=map[k][r.cat]||{rev:0,crm:0};map[k][r.cat].rev+=r.rev;map[k][r.cat].crm+=r.crm_rev;});
 return Object.keys(map).sort().reverse().map(function(k){return {label:k,byCat:map[k]};});}
function setGrain(g){CGRAIN=g;CSEL=null;contribTab();}
function selBucket(l){CSEL=l;contribTab();}
function contribTab(grain){
 if(grain)CGRAIN=grain;
 var rows=contribRows(CGRAIN);
 if(!CSEL||!rows.some(function(r){return r.label===CSEL;}))CSEL=rows.length?rows[0].label:null;
 var lab={day:'일자',week:'주(월시작)',month:'월'}[CGRAIN];
 var h='<div class="tile"><h2>카테고리별 매출·CRM 기여</h2>';

/* ④ 코호트 — 매출·LTV(①⑤) · 카테고리 LTV(⑥) · 브리지·역산(②③) · SKU 첫/재(⑦) */
var COH_SCOPE=null, COH_MODE='ret', FR_CAT=null, FR_WEEK=null, FR_EXPAND=false, GOAL=null;
var _bridge={keep:0,newv:0,firstAOV:45000,exp:0};
function eok(m){return (Math.round(Number(m||0)/1e6)/100).toFixed(2)+'억';}
function addM(ymk,k){var p=String(ymk).split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1+k,1));return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2);}
function tealHeat(t){t=Math.max(0,Math.min(1,t||0));return 'rgba(31,157,87,'+(0.05+t*0.5)+')';}
function markBtns(id,val){var el=document.getElementById(id);if(!el)return;el.querySelectorAll('.btn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===val);});}
function cohortTab(scope){
 if(scope)COH_SCOPE=scope;
 var host=document.getElementById('p4');
 var hasR=D.cohort&&D.cohort.scopes&&D.cohort.scopes.length, hasV=D.cohort_rev&&D.cohort_rev.scopes&&D.cohort_rev.scopes.length;
 if(!hasR&&!hasV){host.innerHTML='<div class="tile"><h2>코호트</h2><div class="d"><b>cohort</b> / <b>cohort_rev</b> 탭 데이터가 없습니다. 08·08b 결과를 붙여넣고 빌드하세요.</div></div>';return;}
 var scopes=hasV?D.cohort_rev.scopes:D.cohort.scopes;
 if(!COH_SCOPE||scopes.indexOf(COH_SCOPE)<0)COH_SCOPE=scopes[0];
 var h='';
 h+='<div class="tile"><h2>코호트 — 첫구매 → 재구매 · 매출·LTV</h2>';
 h+='<div class="d">행=첫구매월 · 열=경과 개월 · 우측 <b>vs평균</b>=코호트 성과(▲앞섬/▼뒤처짐).</div>';
 h+='<div class="btns" id="cohScope">'+scopes.map(function(s){return '<span class="btn '+(s===COH_SCOPE?'on':'')+'" data-v="'+s+'" onclick="cohScopeSel(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</span>';}).join('')+'</div> ';
 h+='<div class="btns" id="cohMode">'+[['ret','재구매율'],['rev','매출'],['ltv','1인 누적 LTV']].map(function(m){return '<span class="btn '+(m[0]===COH_MODE?'on':'')+'" data-v="'+m[0]+'" onclick="cohModeSel(\''+m[0]+'\')">'+m[1]+'</span>';}).join('')+'</div>';
 h+='<div id="cohHeat"></div></div>';
 h+='<div class="tile"><h2>카테고리별 1인 누적 LTV</h2><div class="d">획득 고객 1인당 지금까지 낸 매출(카테 총매출 ÷ 첫구매자).</div><div id="cohCat"></div></div>';
 h+='<div class="tile"><h2>월 매출 브리지 · 목표 역산</h2><div class="d">기존 유지 + 신규 vs 목표. 갭을 신규 획득 또는 유지 상승으로 역산.</div><div id="bridgeBox"></div></div>';
 h+='<div class="tile"><h2>SKU 라인 · 첫구매 vs 재구매 (주차)</h2><div class="d">SKU 라인 관점(B): 그 rep_sku 첫 구매=첫구매, 이후=재구매. 재구매 기여가 근거.</div><div id="frBox"></div></div>';
 host.innerHTML=h;

function cohScopeSel(s){COH_SCOPE=s;markBtns('cohScope',s);renderCohHeat();}
function cohModeSel(m){COH_MODE=m;markBtns('cohMode',m);renderCohHeat();}
function renderCohHeat(){
 var mode=COH_MODE, box=document.getElementById('cohHeat'); if(!box)return;
 var src=mode==='ret'?D.cohort:D.cohort_rev;
 if(!src||!src.byScope[COH_SCOPE]){box.innerHTML='<div class="mini" style="padding:6px 0">이 모드 데이터 없음('+(mode==='ret'?'cohort':'cohort_rev')+' 탭 필요)</div>';return;}
 var rows=src.byScope[COH_SCOPE], offs=src.offsets;
 function cumLtv(row,k){var s=0,any=false;for(var j=0;j<=k;j++){var v=row.cells[j];if(v==null)continue;any=true;s+=v;}return any?s/(row.n||1):null;}
 var maxV=0,maxL=0;
 rows.forEach(function(row){offs.forEach(function(k){var c=row.cells[k];if(c!=null&&mode!=='ret')maxV=Math.max(maxV,c);var l=cumLtv(row,k);if(l!=null)maxL=Math.max(maxL,l);});});
 var perf=rows.map(function(row){if(mode==='ret'){var a=0,c=0;offs.forEach(function(k){if(k>=1&&row.cells[k]!=null){a+=row.cells[k].r;c++;}});return c?a/c:0;}for(var k=offs.length-1;k>=0;k--){var l=cumLtv(row,k);if(l!=null)return l;}return 0;});
 var avg=perf.reduce(function(a,b){return a+b;},0)/(perf.length||1);
 var basis=mode==='ret'?'셀 = 재구매율 %(인원 기준) · M0=100%':(mode==='rev'?'셀 = 그 경과월 <b>실매출</b>(units 비중 배분) · 표기 단위 <b>억원</b>':'셀 = <b>1인 누적 LTV</b> = (M0~해당월 누적매출) ÷ 코호트 첫구매자 · 표기 단위 <b>원</b>');
 var h='<div class="mini" style="margin:2px 0 6px;color:#41505f">'+basis+'</div><div class="wrapx scrolly"><table><tr><th>첫구매월</th><th class="num">코호트</th>'+offs.map(function(k){return '<th>M'+k+'</th>';}).join('')+'<th>vs평균</th></tr>';
 rows.forEach(function(row,ri){
  h+='<tr><td class="rh">'+row.month+'</td><td class="num" style="color:#6a7789">'+fmt(row.n)+'명</td>';
  offs.forEach(function(k){var c=row.cells[k];if(c==null){h+='<td style="background:#fafbfc"></td>';return;}
   var disp,t;
   if(mode==='ret'){disp=c.r+'%';t=c.r/100;}
   else if(mode==='rev'){disp=eok(c);t=maxV?c/maxV:0;}
   else{var l=cumLtv(row,k);disp=won(l);t=maxL?l/maxL:0;}
   h+='<td class="num" style="background:'+tealHeat(t)+'">'+disp+'</td>';});
  var d=perf[ri]-avg, pc=avg?Math.round(d/avg*100):0, col=pc>=0?'#1f8a5b':'#c0392b';
  h+='<td class="num" style="color:'+col+';font-weight:700">'+(pc>=0?'▲':'▼')+Math.abs(pc)+'%</td></tr>';
 });
 h+='</table></div><div class="mini" style="margin-top:5px">재구매율=인원 기준(cohort) · 매출/LTV=cohort_rev · vs평균='+(mode==='ret'?'M1+ 평균 재구매율':'1인 누적 LTV')+' 대비.</div>';
 box.innerHTML=h;
}
function renderCohCat(){
 var box=document.getElementById('cohCat'); if(!box)return;
 var cr=D.cohort_rev; if(!cr||!cr.scopes.length){box.innerHTML='<div class="mini">cohort_rev 탭 필요</div>';return;}
 var list=cr.scopes.filter(function(s){return s!=='전체';}).map(function(cat){var rows=cr.byScope[cat]||[],tot=0,nn=0;rows.forEach(function(row){nn+=row.n;row.cells.forEach(function(v){if(v!=null)tot+=v;});});return {cat:cat,ltv:nn?tot/nn:0};}).sort(function(a,b){return b.ltv-a.ltv;});

function mcell(k,id){return '<div style="flex:1;min-width:110px;background:#f4f7fa;border-radius:8px;padding:8px 10px"><div style="font-size:10px;color:#5b6b82">'+k+'</div><div class="num" id="'+id+'" style="font-size:15px;font-weight:800;margin-top:2px"></div></div>';}
function renderBridge(){
 var box=document.getElementById('bridgeBox'); if(!box)return;
 var cr=D.cohort_rev&&D.cohort_rev.byScope['전체'];
 if(!cr){box.innerHTML='<div class="mini">cohort_rev(전체) 필요</div>';return;}
 var tot={},nw={},newN={};
 cr.forEach(function(row){row.cells.forEach(function(v,k){if(v==null)return;var cal=addM(row.month,k);tot[cal]=(tot[cal]||0)+v;if(k===0){nw[cal]=(nw[cal]||0)+v;newN[cal]=(newN[cal]||0)+row.n;}});});
 var cals=Object.keys(tot).sort(); var last=cals[cals.length-1], last3=cals.slice(-3);
 var newAvg=last3.reduce(function(s,c){return s+(nw[c]||0);},0)/last3.length;
 var newNavg=last3.reduce(function(s,c){return s+(newN[c]||0);},0)/last3.length;
 _bridge.keep=(tot[last]||0)-(nw[last]||0); _bridge.newv=newAvg; _bridge.firstAOV=newNavg?newAvg/newNavg:45000; _bridge.exp=_bridge.keep+_bridge.newv;
 if(GOAL==null){var g=0;try{g=+localStorage.getItem('knollo_goal')||0;}catch(e){}GOAL=g||Math.round(_bridge.exp*1.1/1e6)*1e6;}
 var h='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap"><span style="font-size:11px;color:#5b6b82;white-space:nowrap">이번 달 목표</span>'

  +'<div id="bK" style="position:absolute;left:0;top:0;bottom:0;background:#1f9d57"></div><div id="bN" style="position:absolute;top:0;bottom:0;background:#9FE1CB"></div>'

  +'<div id="bM" style="position:absolute;top:-3px;bottom:-3px;width:2px;background:#141c2b"></div></div>'
  +'<div class="leg" style="margin-top:5px"><span><i style="background:#1f9d57"></i>기존 유지</span><span><i style="background:#9FE1CB"></i>신규</span><span><i style="background:#F0997B"></i>목표 갭</span><span>│ 목표</span></div>'
  +'<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+mcell('기대(유지+신규)','mExp')+mcell('목표 갭','mGap')+mcell('달성률','mRate')+mcell('필요 신규','mNew')+mcell('또는 유지 상승','mUp')+'</div>';
