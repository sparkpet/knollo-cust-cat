<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knollo 고객 유형화 리포트</title>
<style>
:root{--ink:#141c2b;--mut:#5f6e86;--line:#e6ebf3;--brand:#1f9d57;--warn:#e07b39}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,'Segoe UI','Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;
 background:radial-gradient(45% 40% at 12% 8%,#d6f2e3 0%,rgba(214,242,227,0) 60%),radial-gradient(40% 45% at 92% 6%,#dbe8fb 0%,rgba(219,232,251,0) 60%),radial-gradient(50% 45% at 85% 92%,#f6e6da 0%,rgba(246,230,218,0) 55%),radial-gradient(45% 45% at 8% 95%,#e7e0f6 0%,rgba(231,224,246,0) 55%),#f7f9fc}
.wrap{max-width:1200px;margin:0 auto;padding:24px 18px}
.hd{display:flex;justify-content:space-between;align-items:flex-end}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--mut);margin-top:3px}
.meta{font-size:12px;color:var(--mut);text-align:right}.meta b{color:var(--brand)}
.banner{display:none;font-size:11.5px;background:#fff6ed;color:#7a5a1e;border-radius:9px;padding:7px 12px;margin:10px 0}
.menu{display:flex;gap:8px;margin:0 0 4px;padding:12px 0 8px;flex-wrap:wrap;position:sticky;top:0;z-index:30;background:rgba(247,249,252,.9);backdrop-filter:blur(8px)}
.mi{padding:9px 15px;border-radius:11px;background:rgba(255,255,255,.6);border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:13px;color:#5b6b82;backdrop-filter:blur(6px)}
.mi.on{background:#fff;color:var(--brand);box-shadow:0 4px 14px rgba(31,157,87,.14)}
.page{display:none}.page.on{display:block}
.tile{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-top:12px;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(20,30,50,.05)}
.tile h2{font-size:14px;margin:0 0 2px}.tile .d{font-size:11px;color:var(--mut);margin-bottom:9px}
table{border-collapse:collapse;width:100%;font-size:11px}
th,td{border:1px solid #eef1f6;padding:5px 6px;text-align:center}th{background:#f4f7fa;color:#5b6b82;font-weight:600;font-size:10px}
td.rh{background:#f8fafc;font-weight:700;text-align:left;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.l{text-align:left}
.n{font-weight:800;font-size:13px}.bar4{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:4px 0 3px}.bar4>i{display:block}
.mini{font-size:8.6px;color:#6a7789}
.m1 td.cell{cursor:pointer}.m1 td.cell:hover{outline:2px solid var(--brand);outline-offset:-2px}
.cell2{text-align:right}.rev{font-weight:800;font-size:11.3px}.contrib{font-size:9px;color:#5b6b82}.tot{color:#4b3fc0;font-weight:800}
.prow{cursor:pointer}.prow:hover td.rh{background:#eef7f0}.prow.on td{outline:1px solid rgba(31,157,87,.45);outline-offset:-1px}.prow.on td.rh{box-shadow:inset 3px 0 0 var(--brand);background:#eaf7ef}
.scrolly{max-height:460px;overflow:auto}.scrolly th{position:sticky;top:0;z-index:4}
#cohHeat td,#cohHeat th{white-space:nowrap}#cohHeat td .mini{white-space:nowrap}
.cohc0{position:sticky;left:0;z-index:3;background:#f8fafc;min-width:78px}
.cohc1{position:sticky;left:78px;z-index:3;background:#fff;min-width:62px}
.cohcR{position:sticky;right:0;z-index:3;background:#fff;box-shadow:-6px 0 8px -6px rgba(20,30,50,.18)}
.cohc1{box-shadow:6px 0 8px -6px rgba(20,30,50,.12)}
#cohHeat th.cohc0,#cohHeat th.cohc1,#cohHeat th.cohcR{z-index:6;background:#f4f7fa}
.btns{display:inline-flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.btn{font-size:11px;font-weight:700;border:1px solid #d7deea;background:#fff;color:#5b6b82;border-radius:8px;padding:4px 12px;cursor:pointer}.btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.xbrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.xb{white-space:nowrap;border-color:#bfe0cd;color:#1f7a45}.xb:hover{background:#eaf7ef}
.skurow{cursor:pointer}.skurow:hover{background:#f3f9f5}.skurow.on{background:#eaf7ef}
.drill{margin-top:10px;border:1px dashed #c7d0dd;border-radius:10px;padding:10px 12px;background:#fbfcfe;display:none}.drill.on{display:block}
.note{font-size:10.5px;color:#7a5a1e;background:#fff6ed;border-radius:6px;padding:5px 9px;margin-top:6px}
.wrapx{overflow-x:auto}.fail{color:#c0392b}.amt{font-size:9px;color:#5b6b82}.sub2{font-size:10.5px;font-weight:700;color:#41505f;margin:10px 0 3px}
.gl{font-size:11.5px;color:#33414f;line-height:1.55}.gl b{color:#1e2a3a}.gl .row{padding:6px 0;border-bottom:1px solid var(--line)}
.glsec .st{font-size:12px;font-weight:800;color:#1f2b3a;margin:14px 0 7px}
.glgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:720px){.glgrid{grid-template-columns:1fr}}
.glcard{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;border-left:4px solid var(--brand)}
.glcard .t{font-weight:800;font-size:12.5px;margin-bottom:3px;color:#1e2a3a}.glcard .x{font-size:11px;color:#41505f;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:10px;font-weight:700;border-radius:6px;padding:1px 8px;background:#eef1f5;color:#41505f;white-space:nowrap;display:inline-block}.chip.c{color:#fff}
.leg{font-size:10px;color:#5b6b82;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}.leg span{display:inline-flex;gap:4px;align-items:center}.leg i{width:10px;height:10px;border-radius:2px}
</style></head><body><div class="wrap">
<div class="hd"><div><h1>Knollo 고객 유형화 리포트</h1><div class="sub">라이프사이클 × 카테고리 × 브랜드충성 · CRM 기여·전환 · 시트→Apps Script→GitHub 자동빌드</div></div><div class="meta" id="meta"></div></div>
<div class="banner" id="banner"></div>
<div class="menu">
  <div class="mi on" onclick="go(0)">ⓘ 용어·정의</div>
  <div class="mi" onclick="go(1)">① 유형 지형도</div>
  <div class="mi" onclick="go(2)">② 카테고리 매출·CRM 기여</div>
  <div class="mi" onclick="go(3)">③ 발송 전환·기여 매출</div>
  <div class="mi" onclick="go(4)">④ 코호트 · 첫구매·재구매</div>
</div>
<div class="page on" id="p0"></div>
<div class="page" id="p1"></div>
<div class="page" id="p2"></div>
<div class="page" id="p3"></div>
<div class="page" id="p4"></div>
</div>
<script>
var LIFE=["최우수","우량","신규","이탈징후","관망","이탈"];
var CATS=["허니콤츄","덴탈라인업","영양제","위생/패드","산책용품","간식"];
var GC=["#1f6b3f","#7bc49b","#5aa0c9","#c8d0da"], GL=["코","성","관","비"], GN=["코어","성장","관계형성","비충성"];
var LC={"최우수":"#1f6b3f","우량":"#25965a","신규":"#5aa0c9","이탈징후":"#e07b39","관망":"#9b8cc4","이탈":"#8a97a8"};
var num=n=>n===''||n==null?0:Number(n);
var fmt=n=>Number(n||0).toLocaleString('ko-KR');
var won=n=>fmt(Math.round(Number(n||0)))+'원';   // 전체 단위 표기 (예: 1,870,123원)
var pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
/* ★ 인원 추출용 Apps Script 웹앱 URL (배포 후 여기에 입력). 비우면 안내 표시. */
var EXTRACT_URL="https://script.google.com/a/macros/sparkpetkorea.com/s/AKfycbyls84TH10dxtr5ZFv87Xh0JTnJetRCB8wZ-uUOLkKty0gsCPIFe3KeB4_sZHvz1xZF3Q/exec";
function go(i){document.querySelectorAll('.mi').forEach((m,k)=>m.classList.toggle('on',k===i));document.querySelectorAll('.page').forEach((p,k)=>p.classList.toggle('on',k===i));}
function heat(core,tot){var a=Math.min(1,tot?(core/tot)/0.55:0);var t=Math.round(255-(255-233)*a),g=Math.round(255-(255-246)*a),b=Math.round(255-(255-238)*a);return 'rgb('+t+','+g+','+b+')';}
function crmHeat(p){if(!p)return '#fff';var a=Math.min(1,p/0.5);return 'rgba(31,157,87,'+(0.06+a*0.22)+')';}

var D=null, PREVM=null;
function render(d){D=d;
 document.getElementById('meta').innerHTML=`기간 <b>${d.meta.latest_period||''}</b> · 전체 <b>${fmt(d.meta.n)}</b>명<br>빌드 ${d.meta.built_at||''} · 스냅 ${d.meta.periods||d.matrix.length}회`;
 if(d.meta.sample){var b=document.getElementById('banner');b.style.display='block';b.textContent='⚠ 샘플 데이터(실데이터 아님). 시트→Apps Script 빌드 시 report_data.json 으로 대체.';}
 glossary(); matrixTab(); contribTab('day'); convTab(); cohortTab();
}

/* ⓘ 용어집 */
function glossary(){
 function lum(hex){if(!hex||hex[0]!=='#'||hex.length<7)return 1;var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)/255;}
 function chip(t,c){if(!c)return `<span class="chip">${t}</span>`;var dark=lum(c)<0.62;return `<span class="chip" style="background:${c};color:${dark?'#fff':'#2c3a4a'}">${t}</span>`;}
 function chips(arr){return '<div class="chips">'+arr.map(function(a){return chip(a[0],a[1]);}).join('')+'</div>';}
 function card(t,x,extra){return `<div class="glcard" ${extra&&extra.color?`style="border-left-color:${extra.color}"`:''}><div class="t">${t}</div><div class="x">${x}</div>${extra&&extra.chips?chips(extra.chips):''}</div>`;}
 function deftbl(title,sub,colHead,rows){
   return `<div class="glcard" style="grid-column:1/-1"><div class="t">${title}</div><div class="x" style="margin-bottom:6px">${sub}</div>`+
     `<table><tr><th style="text-align:left;width:96px">${colHead}</th><th style="text-align:left">정의</th></tr>`+
     rows.map(function(r){return `<tr><td style="text-align:left;white-space:nowrap;vertical-align:top"><span class="chip" style="background:${r[1]};color:${lum(r[1])<0.62?'#fff':'#2c3a4a'}">${r[0]}</span></td><td style="text-align:left;vertical-align:top" class="x">${r[2]}</td></tr>`;}).join('')+
     `</table></div>`;
 }
 var lifeTbl=deftbl("라이프사이클 <span class='mini'>· 행축</span>","<b>최근성</b>(마지막 결제일로부터 오늘까지 지난 일수) × <b>빈도</b>(주문 건수 = 생성된 주문번호 개수)로 나눕니다. 고객당 <b>1개만</b> 배정(겹치지 않음).","단계",[
   ["최우수",LC["최우수"],"마지막 구매 <b>60일 이내</b> · 주문 <b>5건 이상</b>"],
   ["우량",LC["우량"],"마지막 구매 60일 이내 · 주문 <b>2~4건</b>"],
   ["신규",LC["신규"],"마지막 구매 60일 이내 · 주문 <b>1건</b>(첫 구매)"],
   ["이탈징후",LC["이탈징후"],"마지막 구매 <b>61~150일</b> · 주문 <b>3건 이상</b>(잘 사던 고객이 뜸해짐)"],
   ["관망",LC["관망"],"마지막 구매 61~150일 · 주문 <b>1~2건</b>"],
   ["이탈",LC["이탈"],"마지막 구매 <b>150일 초과</b>(최근 구매 없음)"]]);
 var loyTbl=deftbl("브랜드 충성 등급 <span class='mini'>· 셀 안</span>","<b>최근성과 무관</b>하게 ‘얼마나 자주(주문 건수) · 얼마나 넓게(<b>서로 다른 상품 카테고리 수</b>) 샀나’로만 판단. 위에서부터 <b>먼저 만족하는 등급</b>으로 배정합니다.","등급",[
   ["코어",GC[0],"주문 <b>5건 이상</b> <b>그리고</b> 서로 다른 카테고리 <b>2종 이상</b>(예: 간식+영양제) — <b>둘 다</b> 충족. 5건+라도 한 카테만 샀으면 ‘성장’."],
   ["성장",GC[1],"주문 <b>3건 이상</b>(코어 조건 미충족 · <b>카테고리 수 무관</b>)"],
   ["관계형성",GC[2],"주문 <b>정확히 2건</b> — 첫 재구매(<b>카테고리 수 무관</b>)"],
   ["비충성",GC[3],"주문 <b>1건</b> — 단발(<b>카테고리 수 무관</b>)"]]);
 var intro=card("이 리포트는 무엇인가요?","고객을 <b>구매 패턴</b>으로 나눠 보고(①), 무엇이 <b>매출·CRM</b>에 기여하는지(②③), <b>재구매·LTV·목표 달성</b>까지(④) 한 곳에서 봅니다. 위 메뉴를 <b>①②③④ 순서</b>로 읽으면 됩니다. 모든 매출은 <b>결제완료·회원</b> 기준, 금액 단위는 원(₩)입니다.");

 var sec1=lifeTbl+loyTbl
  + card("대표 카테고리 <span class='mini'>· 열축</span>","그 고객이 <b>가장 자주 산 카테고리</b>(주문 수 1위). ‘어떤 상품군 사람인지’로 고객을 나눕니다.",{chips:CATS.map(function(c){return [c];})})
  + card("지형도 한 칸 읽는 법","한 칸 = (라이프사이클 × 대표카테) 고객 묶음. 큰 숫자=<b>총 인원</b>, 4색 막대=충성등급 비율(코·성·관·비), 배경이 진할수록 <b>코어 비중</b>이 높음. 칸을 <b>클릭</b>하면 등급별 인원과 <b>인원 추출</b>이 열립니다.");

 var sec2=card("② 카테고리 매출·CRM 기여","일/주/월 버튼으로 기간을 바꿔 카테고리별 <b>실매출</b>과 그중 <b>CRM 기여</b>를 봅니다. 표의 <b>행을 클릭</b>하면 아래 보조표가 그 기간의 카테 TOP5 상품·판매코드로 갱신됩니다.")
  + card("CRM 기여란?","매출 중 <b>우리가 보낸 캠페인 쿠폰</b>이 사용된 금액. ‘마케팅이 직접 밀어준 매출’의 근사치입니다.")
  + card("③ 전환 <span class='mini'>· 발송 후 결제</span>","캠페인 발송 뒤 <b>구간별(겹치지 않게)</b> 결제한 인원·금액. 0~3일=즉시 반응, 4~5·6~7일=지연 반응, 7일계=합, <b>미전환</b>=7일 안에 결제 없음.",{chips:[["0~3일","#1f7a45"],["4~5일","#5aa0c9"],["6~7일","#8a97a8"]]})
  + card("전환 매출 3분류","전환 매출을 쿠폰 사용 형태로 나눕니다.",{chips:[["쿠폰=캠페인쿠폰","#1f7a45"],["기여=다른쿠폰","#3b7bbf"],["비쿠폰=무쿠폰","#8a97a8"]]});

 var sec4=card("④ ‘코호트’란?","같은 <b>‘첫 구매 월’</b>에 처음 산 고객 묶음이 코호트입니다. 표의 <b>행=첫구매월</b>, <b>열 M0·M1·…=경과 개월</b>(M0=첫 달). 오래된 코호트일수록 오른쪽으로 길게 채워집니다.")
  + card("재구매율 · 매출 · 1인 누적 LTV","상단 토글로 셀 값이 바뀝니다. <b>재구매율</b>=그 경과월에 다시 산 인원 비율(M0=100%). <b>매출</b>=그 경과월에 낸 실매출. <b>1인 누적 LTV</b>=(첫 달~그 달 누적매출) ÷ 첫구매자 = 고객 1명이 지금까지 낸 금액.")
  + card("우측 ‘M3’ 열과 vs평균","오래된 코호트는 무조건 커 보여서, <b>모두 같은 성숙도(M3·M6·M12)</b> 시점 값으로 공정 비교합니다. <b>vs평균</b> = 그 시점 <b>코호트들의 평균</b> 대비(인원 가중 아님) · ▲=평균보다 좋음. 그 시점에 아직 도달 못 한 최근 코호트는 —.")
  + card("카테고리별 1인 누적 LTV","획득 고객 1인당 지금까지 낸 매출(카테 총매출 ÷ 첫구매자). 어느 카테고리가 <b>반복 구매 경제성</b>이 좋은지 비교합니다.")
  + card("월 매출 브리지 · 목표 역산","이번 달 예상 매출을 <b>기존 유지 + 신규</b>로 나눠 목표와 비교. <b>기존 유지</b>=기존 고객 재구매 매출(최근 3개월 평균), <b>신규</b>=첫구매 매출(최근 3개월 평균), 둘의 합이 <b>‘정상 페이스’ 기대</b>. <b style='color:#3b7bbf'>파란선</b>=이번 달 실제, <b>검은선</b>=목표. 부족분(갭)을 ‘신규 몇 명’ 또는 ‘유지 몇 %’로 역산합니다.")
